
name: Atualizar resultados do TSE

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eleicoes2026-deploy
  cancel-in-progress: false

jobs:
  atualizar:
    name: Atualizar e publicar portal
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar arquivos do portal
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Consultar dados oficiais do TSE
        run: |
          echo "Iniciando consulta ao TSE..."
          python update.py

      - name: Conferir arquivos essenciais
        run: |
          test -f index.html
          test -f app.js
          test -f estilo.css
          echo "Arquivos do portal encontrados."
          echo "Arquivos JSON encontrados:"
          find . -type f -name "*.json" -print

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site para publicacao
        run: |
          mkdir -p _site

          cp index.html _site/
          cp app.js _site/
          cp estilo.css _site/

          if [ -d dados ]; then
            cp -R dados _site/
          fi

          if [ -d data ]; then
            cp -R data _site/
          fi

          touch _site/.nojekyll

          echo "Arquivos preparados para publicacao."

      - name: Enviar arquivos do portal
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar portal
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirmar publicacao
        run: |
          echo "Portal publicado com sucesso."
          echo "URL: ${{ steps.deployment.outputs.page_url }}"
