name: Atualizar resultados do TSE

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eleicoes2026-pages
  cancel-in-progress: false

jobs:
  atualizar:
    name: Atualizar e publicar portal
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar versao atual do repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Conferir a versao do HTML
        shell: bash
        run: |
          echo "Commit publicado:" 
          git rev-parse HEAD
          test -f index.html
          if ! grep -q 'PORTAL-2026-VISUAL-FINAL-2510' index.html; then
            echo 'ERRO: index.html antigo. A versao visual nova nao foi encontrada.'
            exit 1
          fi
          echo 'OK: HTML novo encontrado, com estilos incorporados.'

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install requests

      - name: Consultar dados oficiais do TSE
        run: python update.py

      - name: Montar site sem arquivos antigos
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          if [ -d data ]; then cp -R data _site/data; fi
          if [ -d dados ]; then cp -R dados _site/dados; fi
          touch _site/.nojekyll
          grep -q 'PORTAL-2026-VISUAL-FINAL-2510' _site/index.html
          echo 'OK: arquivo novo incluído na pasta de publicacao.'
          ls -lah _site

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mostrar endereco publicado
        run: echo 'Publicado em ${{ steps.deployment.outputs.page_url }}'
