
name: Atualizar resultados do TSE

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eleicoes2026-deploy
  cancel-in-progress: false

jobs:
  atualizar:
    name: Atualizar e publicar portal
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar arquivos do portal
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validar HTML atualizado
        shell: bash
        run: |
          echo "Verificando HTML do portal..."

          test -f index.html

          grep -q 'PORTAL-2026-PACOTE-INTEGRADO-2510' index.html
          grep -q '<style>' index.html
          grep -q '</style>' index.html

          echo "OK: HTML atualizado e CSS integrado encontrados."

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install requests

      - name: Consultar resultados oficiais do TSE
        run: |
          python update.py

      - name: Preparar site para publicacao
        shell: bash
        run: |
          mkdir -p _site

          cp index.html _site/index.html

          if [ -d data ]; then
            cp -R data _site/
          fi

          if [ -d dados ]; then
            cp -R dados _site/
          fi

          touch _site/.nojekyll

          echo "Validando arquivo que sera publicado..."

          grep -q 'PORTAL-2026-PACOTE-INTEGRADO-2510' _site/index.html
          grep -q '<style>' _site/index.html

          echo "OK: pacote correto preparado."
          ls -lah _site/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos do portal
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar portal
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirmar publicacao
        run: |
          echo "Portal publicado."
          echo "URL: ${{ steps.deployment.outputs.page_url }}"
